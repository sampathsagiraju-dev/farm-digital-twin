[project]
name = "farm-digital-twin"
version = "0.1.0"
description = "A small, extensible digital twin for paddock pasture growth"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "streamlit>=1.30",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
